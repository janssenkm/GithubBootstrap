name: 'Engineering Contract Validation'

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only Gate or an event-backed attestation operation'
        required: true
        type: choice
        options: [gate, review, approve, ready]
      issue_number:
        description: 'Candidate Issue number'
        required: true
        type: string
      source_comment_id:
        description: 'Exact human source comment database ID (review/approve only)'
        required: false
        default: '0'
        type: string

permissions: {}

concurrency:
  group: engineering-governance-${{ github.repository_id }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  read-and-revalidate:
    name: 'Engineering Contract Validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.evaluate.outputs.mode }}
      mutation: ${{ steps.evaluate.outputs.mutation }}
      issue-number: ${{ steps.evaluate.outputs.issue_number }}
      gate-result: ${{ steps.evaluate.outputs.gate_result }}
      operation: ${{ steps.evaluate.outputs.operation }}
    steps:
      - name: 'Checkout trusted default-branch governance code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up locked Python runtime'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: '.github/governance/requirements.txt'

      - name: 'Install hash-locked governance dependencies'
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/governance/requirements.txt

      - name: 'Validate event, current Candidate, and receipt runs'
        id: evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.github/scripts/governance
        run: python -m github_governance.events --phase read

      - name: 'Write deterministic summary'
        if: always()
        env:
          GATE_RESULT: ${{ steps.evaluate.outputs.gate_result }}
          OPERATION: ${{ steps.evaluate.outputs.operation }}
        run: |
          {
            echo '## Engineering Contract Validation'
            echo
            echo "- Gate: ${GATE_RESULT:-FAIL}"
            echo "- Operation: ${OPERATION:-unavailable}"
            echo '- Issue-provided verification commands were not executed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Fail closed on Gate findings'
        if: steps.evaluate.outputs.gate_result == 'FAIL'
        run: exit 1

  gated-write:
    name: 'Governance Attestation Mutation'
    needs: read-and-revalidate
    if: >-
      always() &&
      needs.read-and-revalidate.outputs.mutation == 'true' &&
      (needs.read-and-revalidate.outputs.mode == 'warn' ||
       needs.read-and-revalidate.outputs.mode == 'enforce') &&
      (github.event_name != 'issues' || github.event.issue.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: 'Checkout trusted default-branch governance code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up locked Python runtime'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: '.github/governance/requirements.txt'

      - name: 'Install hash-locked governance dependencies'
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/governance/requirements.txt

      - name: 'Revalidate and apply mode-limited result'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.github/scripts/governance
        run: python -m github_governance.events --phase write
