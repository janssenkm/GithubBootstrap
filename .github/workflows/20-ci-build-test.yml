# Required language-neutral checks for template and generated projects
name: 'CI: Configuration Validation'

on:
  push:
    branches: [main, develop, 'dev/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration-validation:
    name: 'Configuration Validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Validate YAML syntax'
        shell: bash
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/dependabot.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('.github/project-policy.yml'))"
          for workflow in .github/workflows/*.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$workflow"
          done

      - name: 'Check required template assets'
        shell: bash
        run: |
          required=(
            README.md
            CONTRIBUTING.md
            AGENTS.md
            CLAUDE.md
            BOOTSTRAP.md
            .agent/context-policy.md
            .agent/engineering.md
            .agent/host-adapters.md
            .agent/issue-workflow.md
            .agent/security.md
            .agent/tool-policy.md
            .agent/verification.md
            .agents/skills/issue-investigate/SKILL.md
            .agents/skills/issue-author/SKILL.md
            .agents/skills/issue-review/SKILL.md
            .agents/skills/issue-promote/SKILL.md
            .claude/skills/issue-investigate/SKILL.md
            .claude/skills/issue-author/SKILL.md
            .claude/skills/issue-review/SKILL.md
            .claude/skills/issue-promote/SKILL.md
            .python-version
            .github/CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            .github/SETTINGS.md
            .github/WORKFLOWS.md
            .github/dependabot.yml
            .github/governance/requirements.in
            .github/governance/requirements.txt
            .github/governance/tools/actionlint.sha256
            .github/governance/tools/actionlint.version
            .github/project-policy.yml
            .github/schemas/engineering-issue.schema.json
            .github/schemas/project-policy.schema.json
            .github/scripts/check-commit-attribution.sh
            .github/scripts/test-governance.sh
            .github/scripts/validate-rollout
            .github/scripts/governance/github_governance/__init__.py
            .github/scripts/governance/github_governance/__main__.py
            .github/scripts/governance/github_governance/audit.py
            .github/scripts/governance/github_governance/canonical.py
            .github/scripts/governance/github_governance/contract.py
            .github/scripts/governance/github_governance/errors.py
            .github/scripts/governance/github_governance/events.py
            .github/scripts/governance/github_governance/github_api.py
            .github/scripts/governance/github_governance/attestations.py
            .github/scripts/governance/github_governance/policy.py
            .github/scripts/governance/github_governance/pr_binding.py
            .github/scripts/governance/github_governance/milestones.py
            .github/scripts/governance/github_governance/schema_validation.py
            .github/scripts/governance/github_governance/semantic.py
            .github/scripts/governance/github_governance/state.py
            .github/ISSUE_TEMPLATE/config.yml
            .github/ISSUE_TEMPLATE/intake-bug.yml
            .github/ISSUE_TEMPLATE/intake-feature.yml
            .github/ISSUE_TEMPLATE/intake-refactor.yml
            .github/ISSUE_TEMPLATE/candidate.md
            .github/templates/engineering-issue.md
            .github/workflows/00-baseline-check.yml
            .github/workflows/00-issue-intake.yml
            .github/workflows/01-ai-development-workflow.yml
            .github/workflows/02-engineering-governance.yml
            .github/workflows/03-engineering-promotion.yml
            .github/workflows/05-commit-lint.yml
            .github/workflows/10-pr-ai-review.yml
            .github/workflows/20-ci-build-test.yml
            .github/workflows/50-milestone-review.yml
            .github/workflows/51-milestone-review-provisional.yml
            .github/workflows/52-milestone-review-finalize.yml
            .github/workflows/53-milestone-acceptance-intent.yml
            .github/workflows/54-milestone-acceptance-execute.yml
            .github/workflows/55-milestone-acceptance-finalize.yml
            .github/workflows/40-stale.yml
            tests/governance/test_bootstrap_docs.py
            tests/governance/test_validate_rollout.py
            tests/governance/test_milestones.py
            tests/governance/test_milestone_chain.py
          )

          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

          test -x .github/scripts/check-commit-attribution.sh || {
            echo 'Required script is not executable: .github/scripts/check-commit-attribution.sh'
            exit 1
          }

      - name: 'Check human commit attribution'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          zero_sha=0000000000000000000000000000000000000000

          case "$EVENT_NAME" in
            pull_request)
              revision="${BASE_SHA}..${HEAD_SHA}"
              ;;
            push)
              if [[ $AFTER_SHA == "$zero_sha" ]]; then
                echo 'No new commits to check for branch deletion.'
                exit 0
              fi
              if [[ -z $AFTER_SHA ]] \
                || ! git cat-file -e "${AFTER_SHA}^{commit}" 2>/dev/null; then
                echo "Unable to resolve push after commit: ${AFTER_SHA:-<empty>}" >&2
                exit 1
              fi
              if [[ -n $BEFORE_SHA && $BEFORE_SHA != "$zero_sha" ]] \
                && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                revision="${BEFORE_SHA}..${AFTER_SHA}"
              else
                revision="$AFTER_SHA"
              fi
              ;;
            *)
              revision=HEAD
              ;;
          esac

          .github/scripts/check-commit-attribution.sh "$revision"

  security-check:
    name: 'Security Scanning'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 'Require immutable action references'
        shell: bash
        run: |
          invalid=$(
            grep -REn '^[[:space:]]*uses:[[:space:]]+[^[:space:]#]+@[^[:space:]#]+' .github/workflows \
              | grep -Ev '@[0-9a-f]{40}([[:space:]]+#.*)?$' \
              || true
          )
          if [ -n "$invalid" ]; then
            echo "Action references must use full 40-character commit SHAs:"
            echo "$invalid"
            exit 1
          fi
