name: 'Milestone Acceptance Intent'
on:
  issue_comment: {types: [created]}
permissions: {}
concurrency: {group: 'milestone-acceptance-intent-${{ github.repository_id }}', cancel-in-progress: false}
jobs:
  intent:
    name: 'Milestone Acceptance Intent'
    if: github.event.issue.pull_request == null && github.event.comment.body == '/accept-milestone'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {actions: read, checks: read, contents: read, issues: read, pull-requests: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version-file: '.python-version'}
      - run: python -m pip install --disable-pip-version-check --require-hashes -r .github/governance/requirements.txt
      - env: {GH_TOKEN: '${{ github.token }}', PYTHONPATH: '${{ github.workspace }}/.github/scripts/governance'}
        run: python -m github_governance milestone-chain --phase acceptance-intent --review-issue-number '${{ github.event.issue.number }}' --comment-id '${{ github.event.comment.id }}' --repository '${{ github.repository }}' --policy .github/project-policy.yml > phase-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: 'milestone-acceptance-intent-${{ github.run_id }}-${{ github.run_attempt }}', path: phase-result.json, retention-days: 90}
