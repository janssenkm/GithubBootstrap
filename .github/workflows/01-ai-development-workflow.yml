# Read-only bridge from an authorized ready contract to local execution
name: 'Local Development Handoff'

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Ready Engineering Issue number'
        required: true
        type: number

permissions: {}

concurrency:
  group: local-handoff-${{ github.repository_id }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  handoff:
    name: 'Local Execution Handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: 'Checkout trusted control-plane code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Set up locked Python runtime'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: '.github/governance/requirements.txt'

      - name: 'Install hash-locked governance dependencies'
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/governance/requirements.txt

      - name: 'Validate ready contract and emit local handoff'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.github/scripts/governance
        run: >-
          python -m github_governance pr-binding
          --mode handoff
          --issue-number '${{ inputs.issue_number }}'
          --policy .github/project-policy.yml
          --repository-root .
