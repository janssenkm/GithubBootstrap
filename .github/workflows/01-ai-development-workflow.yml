# GitHub Actions workflow reference: https://docs.github.com/en/actions
# Commit SHA pinned for security - update with care
# Last SHA update: 2026-08-21
---
name: 'Development Workflow'

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to develop'
        required: true
        type: number

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  validate-trigger:
    name: 'Validate Trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-proceed: ${{ steps.check.outputs.should-proceed }}
      issue-number: ${{ steps.check.outputs.issue-number }}

    steps:
      - name: 'Check for /ready-for-dev command'
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            let issueNumber, commentBody;

            // Authorization: only repo collaborators (write access) may
            // trigger branch creation. issue_comment events fire for ANY
            // public user; without this check anyone could spam dev/* branches.
            if (context.eventName === 'issue_comment') {
              const assoc = context.payload.comment.author_association;
              const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
              if (!allowed.includes(assoc)) {
                core.notice(`Rejected /ready-for-dev from ${context.payload.comment.user.login} (association: ${assoc})`);
                core.setOutput('should-proceed', 'false');
                core.setOutput('issue-number', String(context.payload.issue.number));
                return;
              }
            }

            if (context.eventName === 'workflow_dispatch') {
              const inputNum = '${{ inputs.issue_number }}';
              issueNumber = inputNum ? parseInt(inputNum) : null;
              commentBody = '/ready-for-dev (manual trigger)';
            } else {
              issueNumber = context.payload.issue.number;
              commentBody = context.payload.comment.body;
            }

            const shouldProceed = commentBody.includes('/ready-for-dev');

            core.setOutput('should-proceed', shouldProceed.toString());
            core.setOutput('issue-number', issueNumber.toString());

            console.log(`Issue: ${issueNumber}, Proceed: ${shouldProceed}`);

  ai-development:
    name: 'AI Development Agent'
    needs: validate-trigger
    if: needs.validate-trigger.outputs.should-proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Fetch Issue Details'
        id: issue-details
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.validate-trigger.outputs.issue-number }}
            });

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.validate-trigger.outputs.issue-number }}
            });

            core.setOutput('title', issue.data.title);
            core.setOutput('body', issue.data.body);
            core.setOutput('labels', JSON.stringify(issue.data.labels));
            core.setOutput('comments', JSON.stringify(comments.data));

      - name: 'Create Development Branch'
        id: create-branch
        run: |
          ISSUE_NUM="${{ needs.validate-trigger.outputs.issue-number }}"
          BRANCH_NAME="dev/issue-${ISSUE_NUM}"
          TIMESTAMP=$(date +%s)
          UNIQUE_BRANCH="${BRANCH_NAME}-${TIMESTAMP}"

          git config user.name "AI Developer"
          git config user.email "dev@bot.local"

          git checkout -b "${UNIQUE_BRANCH}"
          git push origin "${UNIQUE_BRANCH}"

          echo "branch=${UNIQUE_BRANCH}" >> $GITHUB_OUTPUT

      - name: 'Run Development Agent'
        id: dev
        env:
          ISSUE_NUMBER: ${{ needs.validate-trigger.outputs.issue-number }}
          BRANCH: ${{ steps.create-branch.outputs.branch }}
          TITLE: ${{ steps.issue-details.outputs.title }}
        run: |
          # Issue fields are untrusted. jq prevents shell expansion while
          # constructing the development plan JSON.
          jq -n \
            --arg issue_number "$ISSUE_NUMBER" \
            --arg branch "$BRANCH" \
            --arg title "$TITLE" \
            '{
              issue_number: ($issue_number | tonumber),
              branch: $branch,
              title: $title,
              stages: [
                "analyze_requirements",
                "write_tests",
                "implement_features",
                "self_review",
                "create_pr"
              ]
            }' > dev_plan.json

          echo "Dev Plan created"
          cat dev_plan.json

      - name: 'Update Issue Status'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const issueNumber = ${{ needs.validate-trigger.outputs.issue-number }};
            const branch = '${{ steps.create-branch.outputs.branch }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `
              ## 🚀 Development Started

              **Branch:** \`${branch}\`

              Development stages:
              1. ✅ Requirements analysis
              2. ⏳ Test development
              3. ⏳ Feature implementation
              4. ⏳ Self-review
              5. ⏳ PR creation

              Progress will be updated automatically.
              `
            });

            // Add "in-progress" label
            await github.rest.issues.addLabels({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['in-progress', 'development']
            });

      - name: 'Implementation Notes'
        run: |
          echo "=== Development Process ==="
          echo "Implementation follows the repository workflow:"
          echo "1. Analyze requirements thoroughly"
          echo "2. Write test cases first (TDD)"
          echo "3. Implement the feature"
          echo "4. Self-review against guidelines"
          echo "5. Create pull request"
          echo ""
          echo "Branch: ${{ steps.create-branch.outputs.branch }}"
