name: 'Milestone Review Finalize'
on:
  workflow_run: {workflows: ['Milestone Review Provisional'], types: [completed]}
permissions: {}
concurrency: {group: 'milestone-review-finalize-${{ github.repository_id }}', cancel-in-progress: false}
jobs:
  resolve-source:
    name: 'Resolve Source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {actions: read, contents: read}
    outputs: {head-sha: '${{ steps.resolve.outputs.head-sha }}', artifact-id: '${{ steps.resolve.outputs.artifact-id }}'}
    steps:
      - id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const id=context.payload.workflow_run.id; const {data:run}=await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:id});
            const {data:targetRepo}=await github.rest.repos.get({owner:context.repo.owner,repo:context.repo.repo}); const {data:defaultRef}=await github.rest.git.getRef({owner:context.repo.owner,repo:context.repo.repo,ref:`heads/${targetRepo.default_branch}`}); if(defaultRef.object.sha!==context.sha) core.setFailed('workflow code is not the current default-branch commit');
            const repo=context.payload.repository,p=context.payload.workflow_run; if(p.id!==run.id||p.run_attempt!==run.run_attempt||p.path!==run.path||p.event!==run.event||p.head_sha!==run.head_sha||p.status!==run.status||p.conclusion!==run.conclusion||p.repository?.id!==run.repository.id||p.repository?.full_name!==run.repository.full_name||p.head_repository?.id!==run.head_repository.id||p.head_repository?.full_name!==run.head_repository.full_name||p.actor?.login!==run.actor?.login||p.actor?.type!==run.actor?.type||p.triggering_actor?.login!==run.triggering_actor?.login||p.triggering_actor?.type!==run.triggering_actor?.type||!p.triggering_actor?.login||!p.triggering_actor?.type||!run.triggering_actor?.login||!run.triggering_actor?.type||run.repository.id!==repo.id||run.repository.full_name!==repo.full_name||run.head_repository.id!==repo.id||run.head_repository.full_name!==repo.full_name||run.path!=='.github/workflows/51-milestone-review-provisional.yml'||run.event!=='workflow_run'||run.status!=='completed'||run.conclusion!=='success'||!Number.isInteger(run.run_attempt)||run.run_attempt<1||!/^[0-9a-f]{40}$/.test(run.head_sha)||!p.actor?.login||!p.actor?.type||!run.actor?.login||!run.actor?.type) core.setFailed('invalid upstream run');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner:context.repo.owner,repo:context.repo.repo,run_id:id,per_page:100},r=>r.data.artifacts); const expected=`milestone-review-provisional-${run.id}-${run.run_attempt}`; const found=artifacts.filter(a=>!a.expired&&a.name===expected&&a.workflow_run?.id===run.id&&Number.isInteger(a.id)&&a.id>0&&Number.isInteger(a.size_in_bytes)&&a.size_in_bytes>0&&/^sha256:[0-9a-f]{64}$/.test(a.digest)); if(found.length!==1) core.setFailed('invalid upstream artifact'); core.setOutput('head-sha',run.head_sha); core.setOutput('artifact-id',found[0].id);
  finalize:
    name: 'Milestone Review Finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve-source
    permissions: {actions: read, contents: read, issues: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with: {python-version-file: '.python-version'}
      - run: python -m pip install --disable-pip-version-check --require-hashes -r .github/governance/requirements.txt
      - env: {GH_TOKEN: '${{ github.token }}', PYTHONPATH: '${{ github.workspace }}/.github/scripts/governance'}
        run: python -m github_governance milestone-chain --phase review-finalize --upstream-run-id '${{ github.event.workflow_run.id }}' --upstream-run-attempt '${{ github.event.workflow_run.run_attempt }}' --upstream-head-sha '${{ github.event.workflow_run.head_sha }}' --upstream-artifact-id '${{ needs.resolve-source.outputs.artifact-id }}' --repository '${{ github.repository }}' --policy .github/project-policy.yml > phase-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: 'milestone-review-finalized-${{ github.run_id }}-${{ github.run_attempt }}', path: phase-result.json, retention-days: 90}
